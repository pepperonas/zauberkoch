      <div class="ns">
        <h1>Zauberkoch — dein KI-Koch für Rezepte &amp; Cocktails</h1>
        <p class="lead">
          Sag, worauf du Lust hast — Länderküche, Geschmack, was da sein muss und
          was nicht — und sieh live zu, wie daraus ein Rezept auf Kochbuch-Niveau
          entsteht: Zutat für Zutat, Schritt für Schritt, mit exakten Mengen.
          Kostenlos, quelloffen, ohne Tracking.
        </p>

        <h2>Was die App kann</h2>
        <ul>
          <li><strong>Rezepte und Drinks</strong> — zwei Modi, eigene Länderküchen, Geschmacksrichtungen und Gericht-Arten.</li>
          <li><strong>Live-Aufbau</strong> — das Rezept erscheint während des Schreibens, kein Warten auf einen fertigen Block.</li>
          <li><strong>Koch-Modus</strong> — Schritt für Schritt durch die Zubereitung, auf Wunsch per Sprache gesteuert.</li>
          <li><strong>Einkaufsliste</strong> — Zutaten mehrerer Rezepte zusammengefasst, Mengen und Einheiten addiert.</li>
          <li><strong>Wochenplan</strong> — Gerichte auf Tage legen und die ganze Woche in die Einkaufsliste kippen.</li>
          <li><strong>Kühlschrank-Scan</strong> — Foto von dem, was da ist; daraus wird ein Vorschlag.</li>
          <li><strong>Teilen</strong> — Rezepte per Link weitergeben, auf Wunsch öffentlich gelistet.</li>
        </ul>

        <p class="hint">
          Zum Kochen brauchst du JavaScript: das Rezept wird live gestreamt, während
          die KI es schreibt. Schalte es für zauberkoch.de ein — die Seite lädt
          nichts von fremden Servern nach und setzt keine Tracking-Cookies.
        </p>
