# App-spezifische Kopfzeilen fuer zauberkoch.de.
#
# ⚠️ Warum es diese Datei gibt: nginx vererbt add_header NUR, solange die
# tiefere Ebene keines setzt. Die Locations /index.html, /assets/ und /sw.js
# setzen ein eigenes Cache-Control und verlieren damit ALLES aus dem
# server-Block. Sie binden bereits snippets/security-headers.conf ein — das
# traegt aber bewusst nur HSTS/nosniff/Referrer-Policy und laesst CSP und
# X-Frame-Options aus, weil beide nur pro Anwendung sinnvoll sind.
#
# Folge ohne diese Datei: Zauberkochs eigene CSP galt auf /r/ (kein eigenes
# add_header, erbt korrekt) — aber NICHT auf der Startseite, den Rechtstexten
# und allen SPA-Routen, also genau dort, wo HTML ausgeliefert wird.
# Gemessen am 2026-09-16: 3 von 6 Kopfzeilen fehlten auf jeder HTML-Seite.
#
# Diese Datei gehoert zusaetzlich zu security-headers.conf, nicht an deren Stelle.
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.googleusercontent.com; style-src 'self' 'unsafe-inline'; script-src https://analytics.celox.io 'self'; connect-src https://analytics.celox.io 'self'; font-src 'self'; base-uri 'self'; form-action 'self' https://accounts.google.com" always;
